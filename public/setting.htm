<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coming+Soon&display=swap" rel="stylesheet">
    <title>Settings - AskKotyk</title>
</head>
<body>
    <header>
        <div class="logo">
            AskKotyk
        </div>
        <div class="search">
            <input type="text" name="search" placeholder="search">
            <button class="search-button">ASK!</button>
        </div>
        <div class="profile">
            <div class="avatar kotyk-avatar"></div>
            <div class="profile-info">
                <p>Kotyk Kotykov</p>
                <div class="profile-actions">
                    <a href="#">settings</a>
                    <a href="#">logout</a>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="main-container">
            <div class="settings-header">
                <h2>Settings: Kotyk Kotykov</h2>
            </div>

            <form class="settings-form">
                <div class="form-group">
                    <label for="login">Login</label>
                    <input type="text" id="login" name="login" class="form-control" value="kotyk_kotykov">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-control" value="kotyk@mail.ru">
                </div>

                <div class="form-group">
                    <label for="nickname">NickName</label>
                    <input type="text" id="nickname" name="nickname" class="form-control" value="Kotyk Kotykov">
                </div>

                <div class="form-group">
                    <label>Upload avatar</label>
                    <div class="avatar-upload">
                        <div class="current-avatar">
                            <div class="avatar-preview kotyk-avatar"></div>
                            
                        </div>
                        <div class="upload-controls">
                            <span class="file-path">c:\avataring</span>
                            <button type="button" class="btn btn-choose">choose</button>
                        </div>
                    </div>
                </div>

                <div class="form-footer">
                    <button type="submit" class="btn btn-submit">Save</button>
                </div>
            </form>
        </div>

        <aside>
            <div class="tags-container">
                <h3>Popular Tags</h3>
                <div class="tags">
                    <a href="">perl</a>
                    <a href="" class="text-red">python</a>
                    <a href="">Technopark</a>
                    <a href="" class="text-red">Mysql</a>
                    <a href="" class="text-green">django</a>
                </div>
            </div>
            <div class="best-members">
                <h3>Best Members</h3>
                <div class="members">
                    <a href="">Kotyk Kotykov</a>
                    <a href="">tech_guru</a>
                    <a href="">Murzyk</a>
                    <a href="">Pushok</a>
                </div>
            </div>
        </aside>
    </main>
</body>
</html>
