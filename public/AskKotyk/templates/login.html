{% extends 'base.html' %}

{% block title %}Log In - AskKotyk{% endblock %}

{% block content %}
<div class="main-container">
    <div class="auth-header">
        <h2>Log In</h2>
        <div class="error-message">Sorry, wrong password!</div>
    </div>

    <form class="auth-form">
        <div class="form-group">
            <label for="login">Login</label>
            <input type="text" id="login" name="login" class="form-control" placeholder="Enter your login here">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" value="**********">
        </div>

        <div class="form-footer">
            <button type="submit" class="btn btn-submit">Log in!</button>
            <a href="{% url 'app:signup' %}" class="auth-link">create new account</a>
        </div>
    </form>
</div>
{% endblock %}
